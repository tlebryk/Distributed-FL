version: '3.8'

services:
  fl-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "50051:50051"  # Expose the gRPC port (the code uses 50051, not 9000)
    volumes:
      - ./model_update_pb2.py:/app/model_update_pb2.py
      - ./model_update_pb2_grpc.py:/app/model_update_pb2_grpc.py
      - ./server.py:/app/server.py
    command: ["python", "server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.socket().connect(('localhost', 50051))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fl-client-1:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      fl-server:
        condition: service_healthy
    volumes:
      - ./model_update_pb2.py:/app/model_update_pb2.py
      - ./model_update_pb2_grpc.py:/app/model_update_pb2_grpc.py
      - ./client.py:/app/client.py
    command: ["python", "client.py"]
    environment:
      - SERVER_ADDRESS=fl-server:50051  # Point to the server service
    restart: on-failure

  fl-client-2:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      fl-server:
        condition: service_healthy
    volumes:
      - ./model_update_pb2.py:/app/model_update_pb2.py
      - ./model_update_pb2_grpc.py:/app/model_update_pb2_grpc.py
      - ./client.py:/app/client.py
    command: ["python", "client.py", "--client_id", "client_2"]
    environment:
      - SERVER_ADDRESS=fl-server:50051
    restart: on-failure

# You can add more clients by duplicating the fl-client-2 section and 
# incrementing the client ID in the command