syntax = "proto3";

package federated;

// Message sent by the client with model update
message ModelUpdate {
  string client_id = 1;
  bytes update = 2;         // Serialized (and optionally compressed) model update payload
  int32 version = 3;        // For version tracking
  int64 timestamp = 4;      // For ordering and verification
  float pylint_score = 5;        // Weight of this update
}

// Message sent by the server containing aggregated model
message AggregatedModel {
  bytes model_state = 1;    // Serialized (and optionally compressed) global model state
  int32 version = 2;
}

// Acknowledgement message for update receipt
message Acknowledgement {
  bool success = 1;
  string message = 2;
}

// Client request (for retrieving the global model)
message ClientRequest {
  string client_id = 1;
  int32 current_version = 2;
}


// New message types for hybrid approach
message ClientConnection {
  string client_id = 1;
  int32 current_version = 2;
  bool ready_for_training = 3;  // Indicates if client is ready to receive training tasks
}

message ModelVersionInfo {
  bool update_available = 1;
  int32 latest_version = 2;
  bytes model_state = 3;        // Optional: includes model if update_available=true
}

message UpdateNotification {
  int32 new_version = 1;
  string update_type = 2;       // "FULL" or "INCREMENTAL"
}

// Extended service definition
service FederatedLearningService {
  // Existing RPCs
  rpc SubmitUpdate(ModelUpdate) returns (Acknowledgement);
  rpc GetAggregatedModel(ClientRequest) returns (AggregatedModel);
  
  // New RPCs for hybrid approach
  rpc ConnectClient(ClientConnection) returns (ModelVersionInfo);
  rpc SubscribeToUpdates(ClientRequest) returns (stream UpdateNotification);
}
